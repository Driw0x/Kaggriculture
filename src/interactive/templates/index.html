<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaggriculture Interactive</title>
    <style>
        :root {
            font-family: Arial, sans-serif;
            color: #1f2937;
            background: #f3f4f6;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
        }

        .page {
            max-width: 1500px;
            margin: 0 auto;
        }

        .bar, .panel {
            background: white;
            border: 1px solid #d1d5db;
            border-radius: 8px;
        }

        .bar {
            display: flex;
            flex-wrap: wrap;
            gap: 18px;
            align-items: center;
            padding: 12px 16px;
            margin-bottom: 16px;
        }

        .bar strong {
            margin-right: 4px;
        }

        .layout {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 420px;
            gap: 16px;
            align-items: start;
        }

        .panel {
            padding: 14px;
        }

        h2, h3 {
            margin-top: 0;
        }

        iframe {
            width: 100%;
            height: 820px;
            border: 0;
            background: white;
        }

        .command-list {
            width: 100%;
            min-height: 310px;
            font-family: Consolas, monospace;
            font-size: 14px;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 10px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 4px;
        }

        select, input, button {
            width: 100%;
            min-height: 40px;
            font-size: 14px;
        }

        input, select {
            padding: 7px;
            border: 1px solid #9ca3af;
            border-radius: 5px;
            background: white;
        }

        button {
            border: 0;
            border-radius: 5px;
            padding: 9px 12px;
            cursor: pointer;
        }

        .primary {
            background: #2563eb;
            color: white;
        }

        .danger {
            background: #dc2626;
            color: white;
        }

        .secondary {
            background: #e5e7eb;
            color: #111827;
        }

        .queued {
            margin-top: 14px;
            border-top: 1px solid #e5e7eb;
            padding-top: 12px;
        }

        .action {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            padding: 7px 0;
            border-bottom: 1px solid #f0f0f0;
            font-family: Consolas, monospace;
            font-size: 13px;
        }

        .action button {
            width: auto;
            min-height: 30px;
            padding: 4px 8px;
        }

        .json {
            margin-top: 12px;
            padding: 10px;
            background: #111827;
            color: #f9fafb;
            border-radius: 5px;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            font: 12px Consolas, monospace;
        }

        .message {
            min-height: 22px;
            margin-top: 10px;
            font-size: 13px;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 1050px) {
            .layout {
                grid-template-columns: 1fr;
            }

            iframe {
                height: 700px;
            }
        }
    </style>
</head>
<body>
<div class="page">
    <div class="bar">
        <span><strong>Step</strong><span id="step">0</span> / 720</span>
        <span><strong>Jour</strong><span id="day">0</span></span>
        <span><strong>Heure</strong><span id="hour">0</span></span>
        <span><strong>Cash</strong>$<span id="money">0</span></span>
        <span><strong>Hands</strong><span id="hands">0</span></span>
        <span><strong>Session</strong><span id="session">-</span></span>
        <span><strong>Status</strong><span id="status">-</span></span>
    </div>

    <div class="layout">
        <section class="panel">
            <h2>Observation</h2>
            <iframe id="gameFrame" title="Rendu Kaggriculture"></iframe>
        </section>

        <aside class="panel">
            <h2>Commandes</h2>

            <label for="target">Unité ciblée</label>
            <select id="target"></select>

            <label for="command" style="margin-top:10px;">Liste scrollable des commandes</label>
            <select id="command" class="command-list" size="14"></select>

            <div id="itemBox" class="row hidden">
                <div>
                    <label for="item">Item</label>
                    <select id="item"></select>
                </div>
                <div id="quantityBox">
                    <label for="quantity">Quantité</label>
                    <input id="quantity" type="number" min="1" max="9999" value="1">
                </div>
            </div>

            <button id="add" class="primary" style="margin-top:10px;">Ajouter / définir</button>

            <div class="queued">
                <h3>Actions du tick</h3>
                <div id="workerActions"></div>

                <h3 style="margin-top:14px;">Ordres marché <span id="marketCount">0</span>/10</h3>
                <div id="marketActions"></div>

                <pre id="jsonPreview" class="json"></pre>

                <div class="row">
                    <button id="clear" class="secondary">Vider</button>
                    <button id="validate" class="primary">Valider le tick</button>
                </div>

                <button id="reset" class="danger" style="margin-top:10px;">Nouvelle partie</button>
                <div id="message" class="message"></div>
            </div>
        </aside>
    </div>
</div>

<script>
const COMMANDS = [
    {id: 0, group: "worker", label: "PASS", op: "PASS"},
    {id: 1, group: "worker", label: "NORTH", op: "NORTH"},
    {id: 2, group: "worker", label: "SOUTH", op: "SOUTH"},
    {id: 3, group: "worker", label: "EAST", op: "EAST"},
    {id: 4, group: "worker", label: "WEST", op: "WEST"},
    {id: 10, group: "worker", label: "PLANT", op: "PLANT", item: "crop"},
    {id: 11, group: "worker", label: "WATER", op: "WATER"},
    {id: 12, group: "worker", label: "HARVEST", op: "HARVEST"},
    {id: 13, group: "worker", label: "FERTILIZE", op: "FERTILIZE"},
    {id: 20, group: "worker", label: "PICKUP", op: "PICKUP", item: "placeable", quantity: true},
    {id: 21, group: "worker", label: "PLACE", op: "PLACE", item: "placeable", quantity: true},
    {id: 22, group: "worker", label: "DROP", op: "DROP"},
    {id: 30, group: "worker", label: "BUILD_COOP", op: "BUILD_COOP"},
    {id: 31, group: "worker", label: "BUILD_PASTURE", op: "BUILD_PASTURE"},
    {id: 32, group: "worker", label: "FEED", op: "FEED"},
    {id: 33, group: "worker", label: "COLLECT_FERTILIZER", op: "COLLECT_FERTILIZER"},
    {id: 34, group: "worker", label: "CARE", op: "CARE"},
    {id: 35, group: "worker", label: "DIG", op: "DIG"},
    {id: 100, group: "market", label: "BUY_SEED", op: "BUY_SEED", item: "crop", quantity: true},
    {id: 101, group: "market", label: "BUY_PRODUCT", op: "BUY_PRODUCT", item: "product", quantity: true},
    {id: 102, group: "market", label: "BUY_ANIMAL", op: "BUY_ANIMAL", item: "animal", quantity: true},
    {id: 103, group: "market", label: "SELL", op: "SELL", item: "sellable", quantity: true},
    {id: 104, group: "market", label: "HIRE", op: "HIRE"},
    {id: 105, group: "market", label: "BUY_LAND", op: "BUY_LAND"}
];

const ITEMS = {
    crop: ["WHEAT", "CARROT", "TOMATO", "STRAWBERRY", "MELON"],
    animal: ["GOOSE", "COW", "SHEEP"],
    product: ["WHEAT", "CARROT", "TOMATO", "STRAWBERRY", "MELON", "EGG", "MILK", "WOOL", "FERTILIZER"],
    placeable: ["WHEAT", "CARROT", "TOMATO", "STRAWBERRY", "MELON", "EGG", "MILK", "WOOL", "FERTILIZER", "GOOSE", "COW", "SHEEP"],
    sellable: ["WHEAT", "CARROT", "TOMATO", "STRAWBERRY", "MELON", "EGG", "MILK", "WOOL", "FERTILIZER"]
};

let handCount = 0;
let farmerAction = ["PASS"];
let handActions = [];
let marketActions = [];

const target = document.getElementById("target");
const command = document.getElementById("command");
const itemBox = document.getElementById("itemBox");
const item = document.getElementById("item");
const quantityBox = document.getElementById("quantityBox");
const quantity = document.getElementById("quantity");
const message = document.getElementById("message");

function fillTargets() {
    const previous = target.value;
    target.innerHTML = '<option value="farmer">Farmer</option>';
    for (let i = 0; i < handCount; i++) {
        const option = document.createElement("option");
        option.value = `hand:${i}`;
        option.textContent = `Hand ${i + 1}`;
        target.appendChild(option);
    }
    target.insertAdjacentHTML("beforeend", '<option value="market">Marché</option>');
    if ([...target.options].some(option => option.value === previous)) target.value = previous;
    updateCommands();
}

function updateCommands() {
    const group = target.value === "market" ? "market" : "worker";
    command.innerHTML = "";
    COMMANDS.filter(entry => entry.group === group).forEach(entry => {
        const option = document.createElement("option");
        option.value = entry.id;
        option.textContent = `${String(entry.id).padStart(3, "0")}  ${entry.label}`;
        command.appendChild(option);
    });
    command.selectedIndex = 0;
    updateArguments();
}

function updateArguments() {
    const entry = COMMANDS.find(commandInfo => String(commandInfo.id) === command.value);
    if (!entry || !entry.item) {
        itemBox.classList.add("hidden");
        return;
    }

    itemBox.classList.remove("hidden");
    item.innerHTML = "";
    ITEMS[entry.item].forEach(name => {
        const option = document.createElement("option");
        option.value = name;
        option.textContent = name;
        item.appendChild(option);
    });
    quantityBox.classList.toggle("hidden", !entry.quantity);
}

function buildCommand() {
    const entry = COMMANDS.find(commandInfo => String(commandInfo.id) === command.value);
    if (!entry) return ["PASS"];

    const result = [entry.op];
    if (entry.item) result.push(item.value);
    if (entry.quantity) {
        const amount = Math.max(1, Math.min(9999, Number.parseInt(quantity.value, 10) || 1));
        result.push(amount);
    }
    return result;
}

function addAction() {
    const built = buildCommand();

    if (target.value === "market") {
        if (marketActions.length >= 10) {
            showMessage("Maximum 10 ordres marché par tick.", true);
            return;
        }
        marketActions.push(built);
    } else if (target.value === "farmer") {
        farmerAction = built;
    } else {
        const index = Number(target.value.split(":")[1]);
        handActions[index] = built;
    }

    renderActions();
    showMessage("");
}

function removeMarket(index) {
    marketActions.splice(index, 1);
    renderActions();
}

function renderActions() {
    const worker = document.getElementById("workerActions");
    worker.innerHTML = "";

    addActionLine(worker, "Farmer", farmerAction);
    handActions.forEach((action, index) => addActionLine(worker, `Hand ${index + 1}`, action));

    const market = document.getElementById("marketActions");
    market.innerHTML = "";
    marketActions.forEach((action, index) => {
        const line = document.createElement("div");
        line.className = "action";

        const text = document.createElement("span");
        text.textContent = `${index + 1}. ${JSON.stringify(action)}`;

        const button = document.createElement("button");
        button.className = "secondary";
        button.textContent = "X";
        button.addEventListener("click", () => removeMarket(index));

        line.append(text, button);
        market.appendChild(line);
    });

    document.getElementById("marketCount").textContent = marketActions.length;
    document.getElementById("jsonPreview").textContent = JSON.stringify(currentAction(), null, 2);
}

function addActionLine(container, name, action) {
    const line = document.createElement("div");
    line.className = "action";

    const text = document.createElement("span");
    text.textContent = `${name}: ${JSON.stringify(action)}`;

    line.appendChild(text);
    container.appendChild(line);
}

function currentAction() {
    return {
        farmer: farmerAction,
        hands: handActions,
        market: marketActions
    };
}

function resetActions() {
    farmerAction = ["PASS"];
    handActions = Array.from({length: handCount}, () => ["PASS"]);
    marketActions = [];
    renderActions();
}

function refreshRender() {
    document.getElementById("gameFrame").src = `/render?t=${Date.now()}`;
}

async function refreshState() {
    const response = await fetch("/state");
    const state = await response.json();

    document.getElementById("step").textContent = state.step;
    document.getElementById("day").textContent = state.day;
    document.getElementById("hour").textContent = state.hour;
    document.getElementById("money").textContent = state.money;
    document.getElementById("hands").textContent = state.hands;
    document.getElementById("session").textContent = state.session;
    document.getElementById("status").textContent = state.status;

    if (state.hands !== handCount) {
        handCount = state.hands;
        handActions = Array.from({length: handCount}, () => ["PASS"]);
        fillTargets();
        renderActions();
    }

    document.getElementById("validate").disabled = state.done;
}

async function validateTick() {
    const response = await fetch("/step", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify(currentAction())
    });

    const result = await response.json();
    if (!response.ok) {
        showMessage(result.error || "Erreur pendant le tick.", true);
        return;
    }

    handCount = result.hands;
    fillTargets();
    resetActions();
    await refreshState();
    refreshRender();
    showMessage(`Tick validé. Session enregistrée dans ${result.session}.`);
}

async function newGame() {
    const response = await fetch("/reset", {method: "POST"});
    const result = await response.json();

    handCount = result.hands;
    fillTargets();
    resetActions();
    await refreshState();
    refreshRender();
    showMessage(`Nouvelle partie : ${result.session}`);
}

function showMessage(text, error = false) {
    message.textContent = text;
    message.style.color = error ? "#b91c1c" : "#166534";
}

target.addEventListener("change", updateCommands);
command.addEventListener("change", updateArguments);
document.getElementById("add").addEventListener("click", addAction);
document.getElementById("clear").addEventListener("click", resetActions);
document.getElementById("validate").addEventListener("click", validateTick);
document.getElementById("reset").addEventListener("click", newGame);

(async function init() {
    const response = await fetch("/state");
    const state = await response.json();
    handCount = state.hands;
    fillTargets();
    resetActions();
    await refreshState();
    refreshRender();
})();
</script>
</body>
</html>
